<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Neuro Metro: AVUI — Map</title>
<link rel="stylesheet" href="styles/map.css">

<!-- The same turbulence the battle system's title art swims in (#logoWave):
     fractal noise whose frequency drifts over 19s, displacing the image
     through it. Copied rather than shared — the two apps are siblings and do
     not reach into each other's files. Applied to the whole map, not one
     element, so the city itself is what is faintly breathing. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="mapWave" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.014" numOctaves="2" seed="7" result="n">
      <animate attributeName="baseFrequency" dur="19s" repeatCount="indefinite"
               values="0.008 0.014; 0.013 0.008; 0.008 0.014"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>

<div class="phone">
 <div class="screen" id="screen">
   <canvas id="map"></canvas>

   <div class="hud">
     <!-- THE ONLY NON-MAP-ANCHORED ELEMENT ON THE MAP. Zoom lives on wheel,
          pinch and double-tap; the player's name and state are drawn on the
          canvas beside their marker, where they belong. -->
     <button class="menubtn hudbtn" id="menuBtn"></button>

     <!-- WHAT CITY THIS IS AND WHAT IS HAPPENING TO IT. Where you are is drawn
          on the canvas by the marker; this is the other half — WHEN you are,
          and what the city is doing about it. -->
     <div class="citybar" id="cityBar"></div>

     <!-- the same bubble the battle system explains an ability with -->
     <div class="tipveil" id="tipVeil"></div>
     <div class="tip pxr" id="tip"></div>
     <div class="menu" id="menu"></div>

     <!-- the only controls that exist while the train is running -->
     <!-- WHAT YOU ARE CARRYING INTO THE NEXT FIGHT. The same gauge the profile
          card draws, on the one screen where the decision it informs is
          actually being made: farm another orb, or take the enemy now. -->
     <div class="ridestats" id="rideStats">
       <div class="gwrap">
         <canvas class="gaugecv dead" id="rGaugeDead"></canvas>
         <canvas class="gaugecv" id="rGauge"></canvas>
       </div>
       <div class="tagrow">
         <span class="tag ms pxr" id="rTagMs"></span>
         <span class="tag ec ramp pxr" id="rTagEc"></span>
       </div>
     </div>

     <button class="endbtn bigbtn pxr hudbtn" id="endRide">END</button>
     <button class="bagbtn bigbtn pxr hudbtn" id="bagBtn">BAGGAGE</button>
     <div class="baggage" id="baggage"></div>

     <!-- GDD 4: where this leg is going and how much of it is bridged -->
     <div class="routehead" id="routeHead"></div>

     <!-- GDD 5: the Traveler's Dilemma, at every intermediate platform -->
     <div class="dilemma framed" id="dilemma"></div>

     <!-- station inspection, and where a destination is chosen -->
     <div class="peek framed" id="peek"></div>

     <!-- first boot: name, affinities, and the save file that is the only
          copy of a run that survives a phone clearing its storage -->
     <div class="create" id="create"></div>
   </div>

   <!-- THE BATTLE SYSTEM, WHEN THERE IS ONE. Mounted only for the length of a
        fight and torn down after, so it is not sitting behind the map keeping
        its own clock and audio graph alive for the rest of the session. The
        curtain opens onto it; the flash covers its removal. -->
   <canvas id="battleWipe"></canvas>
   <div id="battleFlash"></div>

   <!-- ONE file input for the whole app. Hidden; creation and the SAVE tab
        both click it. A drop target would be useless on a phone. -->
   <input type="file" id="saveFile" accept="application/json,.json"
          style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
 </div>
</div>

<!-- ================= LOAD ORDER =================
     Every file shares one global scope, so order is the dependency graph — the same
     convention as BATTLE SYSTEM. GENERATED (rebuild from the shared spreadsheet):
       data.js  <- ../shared/tools/build_data.py --app MAP

     util    -> bare helpers, no dependencies
     font    -> the 3x5 map font, no dependencies
     glyphs  -> the 8x8 ability icons and the station ring, as SVG
     data    -> EMOTIONS, STATIONS, LINES, SOUNDS, RULES: the network and its palette
     net     -> everything DERIVED from those two tables (routing, interchanges,
                label sides). Must follow data.
     states  -> the station-state registry. Defines only; reads STATIONS at run time
     gear    -> armor/set passives, and the arithmetic that turns kit into stats
     world   -> the hour, the day, the weather, and what they do to a station
     player  -> who is riding, what they carry, and the save
     route   -> paths across the network, gated by Line Keys
     audio   -> the synth and the music slot. Reads RULES/SOUNDS at run time
     travel  -> the travel screen: parallax, track, train
     elements-> what spawns around the train, and the Emotional Trip bar
     run     -> the multi-leg trip and the vault it is wagering
     bridge  -> the 13 contract with combat
     encounter-> hands a fight to the battle system, mounted in a frame
     vault   -> saves: the file, the code, snapshots, and the seam for cloud
     peek    -> the station panel
     menu    -> the pause menu: profile, loadout, inventory, save
     create  -> first boot: name, affinities, and the save file
     hud     -> the DOM panels: stats, route header, dilemma, baggage
     journey -> the ride's state machine, the player marker, the wipes
     mapview -> camera, rasteriser, input; boots on DOMContentLoaded

     travel and journey call into mapview's rasteriser and mapview calls back into
     theirs. That is fine here and only here: they are all function DECLARATIONS,
     which hoist, and none of them runs until the first frame.
     ============================================== -->
