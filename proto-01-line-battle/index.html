<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#141419">
<title>NEURO-METRO: AVUI — proto 01</title>
<style>
:root{
  /* emotion colours are the identity — unchanged */
  --fury:#ff4d3d; --sorrow:#4a86ff; --euphoria:#ffc63d;
  --apathy:#8a7fa8; --nostalgia:#ff5fae; --stoic:#35d6b0;
  /* SNES-era neutrals: deep indigo menu boxes rather than near-black */
  --void:#0c0a16; --dark:#191534; --panel:#272150; --panelHi:#3a3270;
  --line:#5b4fa0; --ink:#f4f0e4;
  --deadred:#320a18;
  --px:2px; --r1:2px; --r2:4px;
  --bevel: inset 1px 1px 0 rgba(255,255,255,.16), inset -1px -1px 0 rgba(0,0,0,.42);
  --drop: drop-shadow(1px 2px 0 rgba(6,4,14,.7));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--void); color:var(--ink);
  font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
  font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  -webkit-font-smoothing:none; -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none}
.pxr{clip-path:polygon(
  var(--r2) 0, calc(100% - var(--r2)) 0,
  calc(100% - var(--r2)) var(--r1), calc(100% - var(--r1)) var(--r1),
  calc(100% - var(--r1)) var(--r2), 100% var(--r2),
  100% calc(100% - var(--r2)), calc(100% - var(--r1)) calc(100% - var(--r2)),
  calc(100% - var(--r1)) calc(100% - var(--r1)), calc(100% - var(--r2)) calc(100% - var(--r1)),
  calc(100% - var(--r2)) 100%, var(--r2) 100%,
  var(--r2) calc(100% - var(--r1)), var(--r1) calc(100% - var(--r1)),
  var(--r1) calc(100% - var(--r2)), 0 calc(100% - var(--r2)),
  0 var(--r2), var(--r1) var(--r2), var(--r1) var(--r1), var(--r2) var(--r1))}
.pxr-sh{filter:var(--drop)}

.phone{position:relative; width:100vw; height:100dvh; max-width:420px; max-height:920px;
  background:var(--dark); overflow:hidden; display:flex; flex-direction:column}
@media (min-width:520px) and (min-height:760px){
  .phone{border-radius:30px; border:3px solid var(--line);
    box-shadow:0 0 0 10px var(--dark),0 0 0 12px var(--line),0 22px 52px rgba(0,0,0,.7);
    height:min(92dvh,880px)}
  .phone::after{content:""; position:absolute; top:8px; left:50%; transform:translateX(-50%);
    width:62px; height:4px; border-radius:2px; background:var(--void); z-index:60}
  .screen{padding-top:20px}
}
.screen{display:flex; flex-direction:column; height:100%; padding:7px 7px 8px; gap:5px;
  position:relative; overflow:hidden; transition:filter 1.4s linear}
.panel,.lane-wrap,.tray,.depart,.stage,.pstrip{position:relative; z-index:2}
.panel{border:var(--px) solid var(--line); box-shadow:var(--bevel);
  background:linear-gradient(180deg,var(--panelHi) 0%,var(--panel) 58%,var(--dark) 100%)}

/* ============ GAUGE ============ */
.unit{padding:4px 11px}
.gwrap{position:relative; height:62px}
.gauge{position:absolute; left:0; right:0; top:23px; height:16px;
  background:var(--void); border:var(--px) solid var(--line); box-shadow:var(--bevel);
  transition:box-shadow .3s linear, transform 1.2s linear}
.gauge > .seg{position:absolute; top:0; bottom:0; transition:left .22s steps(6),width .22s steps(6)}
.g-empty{left:0}
.p .g-empty{background:rgba(53,214,176,.30); box-shadow:inset 0 0 12px rgba(53,214,176,.8)}
.e .g-empty{background:rgba(255,77,61,.27);  box-shadow:inset 0 0 12px rgba(255,77,61,.75)}
.g-dead{background-color:var(--deadred); background-image:var(--warn); background-size:8px 8px}
.g-ec{left:0; background:linear-gradient(180deg,#ffe08a 0%,var(--euphoria) 45%,#c98f16 100%);
  box-shadow:0 0 7px rgba(255,198,61,.5)}
.g-over{animation:overload .34s steps(2) infinite alternate; z-index:3}
@keyframes overload{
  from{background:var(--fury); box-shadow:0 0 7px var(--fury)}
  to{background:var(--euphoria); box-shadow:0 0 14px var(--euphoria)}}
.g-spend{z-index:3; animation:spendPulse .40s steps(2) infinite alternate}
@keyframes spendPulse{
  from{background:var(--void)} to{background:var(--ink); box-shadow:0 0 11px var(--ink)}}
.g-charge{background:var(--nostalgia); box-shadow:0 0 8px var(--nostalgia); z-index:3;
  animation:pulse .5s steps(2) infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:.95}}
.gauge::after{content:""; position:absolute; inset:0; pointer-events:none; z-index:4;
  background:repeating-linear-gradient(90deg,transparent 0 4px,rgba(0,0,0,.34) 4px 5px)}
.chev{position:absolute; top:18px; height:26px; width:15px; z-index:9; pointer-events:none;
  transition:left .22s steps(6); filter:drop-shadow(0 0 4px var(--ink)) drop-shadow(0 0 10px var(--ink))}
.chev svg{width:100%; height:100%; display:block}
.chev.near{animation:doom .38s steps(2) infinite alternate}
@keyframes doom{
  from{filter:drop-shadow(0 0 4px var(--ink)) drop-shadow(0 0 10px var(--ink))}
  to{filter:drop-shadow(0 0 8px var(--fury)) drop-shadow(0 0 18px var(--fury)) brightness(1.3)}}
.g-proj{position:absolute; top:20px; height:22px; width:var(--px); background:var(--fury);
  box-shadow:0 0 5px var(--fury); z-index:5; transition:left .22s steps(6)}
/* value tags stay large — they are the only numbers on screen */
.tag{position:absolute; transform:translateX(-50%); padding:2px 7px; font-size:17px;
  color:#0c0a16; letter-spacing:.02em; white-space:nowrap; z-index:12; line-height:1.2;
  transition:left .22s steps(6); box-shadow:var(--bevel), 1px 1px 0 rgba(6,4,14,.7)}
.tag.ms{top:0; background:linear-gradient(180deg,#ffffff,var(--ink) 60%,#c9c3b0)}
.tag.ec{bottom:0; background:linear-gradient(180deg,#ffe08a,var(--euphoria) 55%,#c98f16)}
.shieldpip{position:absolute; left:0; top:1px; width:13px; height:13px; color:var(--stoic);
  z-index:13; filter:drop-shadow(0 0 5px var(--stoic))}
.hide{display:none !important}

/* ============ STAGE ============ */
.stage{flex:1; min-height:78px; display:flex; align-items:center; justify-content:center}
.sprwrap{position:relative; width:min(52vw,186px); height:min(52vw,186px)}
.sprwrap canvas{position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated}
#sprOut{z-index:2}
#sprIn{z-index:1}
/* the player's layers: a very large circle, so only a gentle arc crosses the strip */
.pstrip{position:relative; width:100%; aspect-ratio:120/32; flex:none}
.pstrip canvas{position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated}
#pRingsOut{z-index:2}
#pRingsIn{z-index:1}

.bigtag{position:absolute; left:50%; z-index:22; transform:translateX(-50%);
  padding:3px 9px; font-size:13px; letter-spacing:.09em; color:#0c0a16;
  box-shadow:var(--bevel), 1px 2px 0 rgba(6,4,14,.7); white-space:nowrap; pointer-events:none;
  animation:tagIn .9s steps(6) forwards}
.bigtag.dmg{background:linear-gradient(180deg,#ff8b7f,var(--fury) 55%,#b32a1e); font-size:19px}
.bigtag.absorb{background:linear-gradient(180deg,#ffe08a,var(--euphoria) 55%,#c98f16)}
.bigtag.block{background:linear-gradient(180deg,#8bf0d8,var(--stoic) 55%,#1c9b7c)}
.bigtag.off{background:linear-gradient(180deg,#ffffff,var(--ink) 60%,#c9c3b0)}
@keyframes tagIn{
  0%{opacity:0; transform:translateX(-50%) scale(.5)}
  25%{opacity:1; transform:translateX(-50%) scale(1.14)}
  40%{transform:translateX(-50%) scale(1)}
  80%{opacity:1; transform:translateX(-50%) scale(1)}
  100%{opacity:0; transform:translateX(-50%) scale(1.04)}}

.shake{animation:shk .24s steps(1) 1}
@keyframes shk{0%{transform:translate(0,0)}12%{transform:translate(-4px,2px)}25%{transform:translate(4px,-2px)}
  37%{transform:translate(-3px,-2px)}50%{transform:translate(3px,2px)}62%{transform:translate(-2px,1px)}
  75%{transform:translate(2px,-1px)}87%{transform:translate(-1px,0)}100%{transform:translate(0,0)}}
.flash{position:absolute; inset:0; background:var(--ink); opacity:0; pointer-events:none; z-index:34}
.flash.on{animation:fla .1s steps(2) 1}
@keyframes fla{0%{opacity:.42}100%{opacity:0}}
.screen.slowmo{filter:saturate(1.5) contrast(1.15)}
.screen.slowmo .gauge > .seg{transition-duration:1.9s !important}
.gauge.clash{box-shadow:0 0 22px var(--ink),0 0 44px var(--fury); transform:scale(1.06)}
.pt{position:absolute; z-index:36; pointer-events:none; box-shadow:1px 1px 0 rgba(6,4,14,.8)}
.wave{position:absolute; z-index:35; width:26px; height:26px; pointer-events:none;
  border:3px solid var(--ink); border-radius:50%; box-shadow:0 0 18px var(--ink)}

/* ============ LANES ============ */
.lane{position:relative; overflow:hidden; height:38px; display:flex; align-items:center;
  background:var(--void); border:var(--px) solid var(--line); box-shadow:var(--bevel)}
.lane.zoom{height:60px}
.track{display:flex; align-items:center; gap:0; padding:0 6px; position:relative;
  transition:transform .3s steps(6); will-change:transform}
.link{flex:none; width:9px; height:5px; background:currentColor; box-shadow:0 1px 0 rgba(6,4,14,.7)}
.lane.zoom .link{width:14px; height:7px}
.link.dead{color:var(--line); box-shadow:none; opacity:.7;
  background:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 6px)}
.term{flex:none; width:0; height:0; border-right:6px solid currentColor;
  border-top:5px solid transparent; border-bottom:5px solid transparent; filter:var(--drop)}
.term.dead{color:var(--line); filter:none; opacity:.55}
.lane.zoom .term{border-right-width:9px; border-top-width:7px; border-bottom-width:7px}
.station{position:relative; flex:none; width:28px; height:28px;
  transition:width .3s steps(4),height .3s steps(4),transform .18s steps(3),filter .18s linear}
.lane.zoom .station{width:46px; height:46px}
.station svg{width:100%; height:100%; display:block}
.station.dragging{opacity:.6; z-index:5; transform:translateY(-3px) scale(1.08)}
.station.active{filter:drop-shadow(0 0 9px currentColor) drop-shadow(0 0 20px currentColor) brightness(1.45);
  transform:scale(1.3); z-index:6}
.station.spent{opacity:.18}

/* ============ TRAY ============ */
.tray{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:5px}
.abil{display:flex; align-items:center; justify-content:center; gap:4px; padding:5px 3px; cursor:pointer;
  border:var(--px) solid currentColor; box-shadow:var(--bevel);
  background:linear-gradient(180deg,var(--panelHi),var(--panel) 60%,var(--dark))}
.abil svg{width:15px; height:15px; flex:none}
.abil .d{font-size:9px; color:var(--ink); letter-spacing:.01em}
.abil:active{transform:translate(1px,1px)}
.abil.dis{color:var(--apathy); opacity:.38; pointer-events:none}
.abil.dis .d{color:var(--apathy)}
.depart{width:100%; padding:8px; font:inherit; font-size:11px; letter-spacing:.22em; cursor:pointer;
  color:var(--void); border:var(--px) solid var(--ink); box-shadow:var(--bevel);
  background:linear-gradient(180deg,#ffe08a,var(--euphoria) 55%,#c98f16)}
.depart:active{transform:translate(1px,1px)}
.depart.rest{background:linear-gradient(180deg,#b3a7d0,var(--apathy) 55%,#5d5378); color:var(--ink)}
.over{position:absolute; inset:0; background:rgba(12,10,22,.94); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:12px; z-index:40}
.over h1{font-size:19px; letter-spacing:.22em}
.over.win h1{color:var(--stoic); text-shadow:1px 2px 0 var(--void),0 0 14px var(--stoic)}
.over.lose h1{color:var(--fury); text-shadow:1px 2px 0 var(--void),0 0 14px var(--fury)}
</style>

<div class="phone">
 <div class="screen" id="screen">

 </div>
</div>

<script src="data.js"></script>
<script>
"use strict";

const ICONS={
  BOLT :["....xxx.","...xxx..","..xxx...",".xxxxxx.","....xxx.","...xxx..","..xxx...",".xxx...."],
  DROP :["...xx...","...xx...","..xxxx..","..xxxx..",".xxxxxx.","xxxxxxxx",".xxxxxx.","..xxxx.."],
  SPARK:["...xx...","...xx...","x..xx..x",".xxxxxx.",".xxxxxx.","x..xx..x","...xx...","...xx..."],
  SHIELD:["xxxxxxxx","xxxxxxxx","xx....xx","xx....xx","xx....xx",".xx..xx.","..xxxx..","...xx..."],
  WARN :["...xx...","...xx...","..xxxx..","..x..x..",".xx..xx.",".x.xx.x.","xx.xx.xx","xxxxxxxx"]
};
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const R=(x,y)=>`<rect x="${x}" y="${y}" width="1" height="1"/>`;
const hexRGB=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const emoHex=id=>id&&EMOTIONS[id]?EMOTIONS[id].hex:"#8a7fa8";
const emoName=id=>id&&EMOTIONS[id]?EMOTIONS[id].name.toUpperCase():"NEUTRAL";

/* ================= AUDIO — synthesised, crunchy, echoing ================= */
let actx=null, master=null, delay=null, noiseBuf=null;
function crushCurve(steps){
  const n=1024, c=new Float32Array(n);
  for(let i=0;i<n;i++){ const x=i/(n-1)*2-1; c[i]=Math.round(x*steps)/steps; }
  return c;
}
function initAudio(){
  if(actx) return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  actx=new AC();
  master=actx.createGain(); master.gain.value=0.55;
  const crusher=actx.createWaveShaper();          // lo-fi quantisation = the crunch
  crusher.curve=crushCurve(RULES.crusherSteps||12); crusher.oversample="none";
  const lp=actx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=7200;
  delay=actx.createDelay(1.0); delay.delayTime.value=0.115;
  const fb=actx.createGain(); fb.gain.value=0.40;   // repeats = the echo
  delay.connect(fb); fb.connect(delay);
  const dOut=actx.createGain(); dOut.gain.value=0.75;
  delay.connect(dOut); dOut.connect(crusher);
  master.connect(crusher); crusher.connect(lp); lp.connect(actx.destination);
  const len=actx.sampleRate*1.2;
  noiseBuf=actx.createBuffer(1,len,actx.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
}
function sfx(id){
  const s=SOUNDS[id]; if(!s) return;
  initAudio(); if(!actx) return;
  if(actx.state==="suspended") actx.resume();
  const t0=actx.currentTime, dur=s.dur/1000;
  let src;
  if(s.wave==="noise"){
    src=actx.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    src.playbackRate.value=Math.max(0.05,s.f0/700);
  }else{
    src=actx.createOscillator(); src.type=s.wave;
    src.frequency.setValueAtTime(Math.max(20,s.f0),t0);
    src.frequency.exponentialRampToValueAtTime(Math.max(20,s.f1),t0+dur);
  }
  const g=actx.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(s.gain,t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(g); g.connect(master);
  if(s.echo>0){ const e=actx.createGain(); e.gain.value=s.echo; g.connect(e); e.connect(delay); }
  src.start(t0); src.stop(t0+dur+0.05);
}
window.addEventListener("pointerdown",initAudio,{once:true});

/* ================= STATE ================= */
function makeUnit(id){
  const r=UNITS[id];
  return {id, name:r.name, emotion:r.emotion, maxMs:r.max_ms, ms:r.max_ms,
    ec:Math.round(r.max_ms*r.start_ec_pct), shield:0,
    layers:r.layers.slice(0,RULES.maxLayers).map((e,i)=>({e,pos:i,flash:0})),
    pool:r.pool.map(a=>ABILITIES[a]), line:[]};
}
const S={phase:"BUILD", round:1, busy:false, player:makeUnit("player"), enemy:makeUnit("enemy")};

/* Stations fire RIGHTMOST FIRST. Taps prepend, so the first ability you tap
   lands on the right and is therefore the first to execute.               */
const execOrder = line => [...line].reverse();

/* Interactions come entirely from the matchups table. '*' is a wildcard and
   'NONE' means the target has no layers; highest priority wins, so a specific
   pairing always beats a wildcard. Adding a synergy is adding a row.      */
function matchup(layerEmotion, abilityEmotion){
  const L=layerEmotion||"NONE", A=abilityEmotion||"";
  let best=null;
  for(const m of MATCHUPS){
    if(m.enabled===false) continue;
    if(m.attack_emotion!=="*" && m.attack_emotion!==A) continue;
    if(m.layer_emotion !=="*" && m.layer_emotion !==L) continue;
    if(!best || m.priority>best.priority) best=m;
  }
  if(!best) return {dmg:RULES.noLayerDmgMult, ec:RULES.noLayerEcMult,
                    label:"OFF TYPE", cls:"off", sound:"hit"};
  return {dmg:best.dmg_mult, ec:best.ec_mult, label:best.label,
          cls:best.tag_class||"off", sound:best.sound||"hit"};
}
const ecFrom=(ab,dealt,m)=>Math.round((RULES.ecBasis==="POWER"?ab.power:dealt)*m.ec);
function simulate(line, def){
  let ms=def.ms, ec=def.ec, shield=def.shield, layers=def.layers.map(l=>l.e);
  for(const ab of execOrder(line)){
    if(ab.kind!=="DAMAGE") continue;
    if(shield>0){ shield--; continue; }
    const m=matchup(layers[0]||null, ab.emotion);
    const dealt=Math.min(Math.round(ab.power*m.dmg), ms);
    ms-=dealt; ec+=ecFrom(ab,dealt,m);
    if(ab.hits_layer&&layers.length) layers.push(layers.shift());
  }
  return {ms,ec};
}

/* ================= PIXEL ART ================= */
function iconSVG(key){
  const g=ICONS[key]||ICONS.BOLT; let sh="",fg="";
  for(let y=0;y<8;y++)for(let x=0;x<8;x++){if(g[y][x]!=="x")continue; sh+=R(x+1,y+1); fg+=R(x,y);}
  return `<g fill="#0b0b0e">${sh}</g><g fill="currentColor">${fg}</g>`;
}
const RN=18;
function stationSVG(key){
  const c=(RN-1)/2, rO=RN/2-0.5, rI=rO-2.4;
  let ring="",shadow="",inner="";
  for(let y=0;y<RN;y++)for(let x=0;x<RN;x++){
    const d=Math.hypot(x-c,y-c);
    if(d<=rO&&d>=rI){ring+=R(x,y);shadow+=R(x+1,y+1);} else if(d<rI){inner+=R(x,y);}
  }
  let icon="";
  if(key){const g=ICONS[key];for(let y=0;y<8;y++)for(let x=0;x<8;x++) if(g[y][x]==="x") icon+=R(x+5,y+5);}
  return `<svg viewBox="0 0 ${RN+1} ${RN+1}" shape-rendering="crispEdges">
    <g fill="#0b0b0e">${shadow}</g><g fill="#1e1e26">${inner}</g>
    <g fill="currentColor">${ring}${icon}</g></svg>`;
}
function chevronSVG(dir){
  const H=16,W=10,TH=2,GAP=4,SLOPE=.5,mid=(H-1)/2;
  let body="",shadow="";
  for(let k=0;k<2;k++)for(let y=0;y<H;y++){
    const base=Math.round(Math.abs(y-mid)*SLOPE)+k*GAP;
    for(let t=0;t<TH;t++){
      const x = dir<0 ? base+t : (W-1-base-t);
      if(x<0||x>=W) continue;
      body+=R(x,y); shadow+=R(x+1,y+1);
    }
  }
  return `<svg viewBox="0 0 ${W+1} ${H+1}" preserveAspectRatio="none" shape-rendering="crispEdges">
    <g fill="#0b0b0e" opacity=".85">${shadow}</g><g fill="var(--ink)">${body}</g></svg>`;
}
(function(){
  const g=ICONS.WARN; let r="";
  for(let y=0;y<8;y++)for(let x=0;x<8;x++) if(g[y][x]==="x") r+=R(x,y);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8" viewBox="0 0 8 8" shape-rendering="crispEdges"><g fill="#6e1219">${r}</g></svg>`;
  document.documentElement.style.setProperty("--warn",`url("data:image/svg+xml,${encodeURIComponent(svg)}")`);
})();

/* ================= LAYER RINGS =================
   Split across two canvases: the outermost layer draws alone on the top one so
   it can carry a colour-coded CSS glow, while everything behind it draws on the
   lower one and stays unlit. Outer band is thick, inner bands are thin.     */
const DARK_RING=[34,34,44];
const outerR=(pos,cfg)=>Math.max(0, cfg.baseR - pos*cfg.spacing);
function slotGeom(pos,cfg,mult){
  const o=outerR(pos,cfg), oIn=outerR(pos+1,cfg), gap=o-oIn;
  // never let a band swallow the slot inside it, however it is tuned
  const band=Math.min(gap*RULES.layerFill*mult, gap*0.92, o);
  return {outer:o, inner:Math.max(0,o-band)};
}
function rotateLayers(u){
  if(!u.layers.length) return;
  const l=u.layers.shift(); l.pos=RULES.maxLayers; u.layers.push(l);
}
function stepLayers(u){
  u.layers.forEach((l,i)=>{
    l.pos += (i-l.pos)*RULES.layerEase;
    if(Math.abs(l.pos-i)<0.004) l.pos=i;
    if(l.flash>0) l.flash--;
  });
}
function ringsOf(u,t,cfg,which){
  const rings=[];
  if(which!=="outer"){
    for(let i=u.layers.length;i<RULES.maxLayers;i++)
      rings.push({...slotGeom(i,cfg,RULES.layerInnerThick), col:DARK_RING});
  }
  u.layers.forEach((l,i)=>{
    if(which==="outer" && i!==0) return;
    if(which==="inner" && i===0) return;
    const mult = i===0 ? RULES.layerOuterThick : RULES.layerInnerThick;
    const wob=Math.sin(t*0.22 - l.pos*RULES.layerWaveDelay)*cfg.breathe;
    const g=slotGeom(l.pos,cfg,mult);
    let col = l.flash>0 ? [244,240,228] : hexRGB(EMOTIONS[l.e].hex);
    // the wobble TRANSLATES the ring; applying it unevenly squeezed thin bands
    // below one pixel and they vanished entirely
    rings.push({outer:g.outer+wob, inner:Math.max(0,g.inner+wob), col});
  });
  return rings.sort((a,b)=>b.outer-a.outer);
}
const shade=(c,f)=>c.map(v=>Math.max(0,Math.min(255,Math.round(v*f))));
function paint(ctx,W,H,cx,cy,rings){
  const mask=new Int16Array(W*H).fill(-1), edge=new Int8Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const d=Math.hypot(x-cx,y-cy);
    for(let k=0;k<rings.length;k++){
      const r=rings[k];
      if(d<=r.outer&&d>=r.inner){
        mask[y*W+x]=k;
        // a lit outer edge and a shaded inner edge give each band some volume —
        // but only on bands thick enough to have an interior left over
        edge[y*W+x] = (r.outer-r.inner)>=3
          ? (d>=r.outer-1 ? 1 : (d<=r.inner+1 ? -1 : 0)) : 0;
        break;
      }
    }
  }
  const img=ctx.createImageData(W,H), D=img.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x,o=i*4,k=mask[i]; let col=null;
    if(k>=0){
      col=rings[k].col;
      if(edge[i]===1) col=shade(col,1.30);
      else if(edge[i]===-1) col=shade(col,0.58);
    }
    else if(x>0&&y>0&&mask[i-W-1]>=0) col=[12,10,22];
    if(col){D[o]=col[0];D[o+1]=col[1];D[o+2]=col[2];D[o+3]=255;}
  }
  ctx.putImageData(img,0,0);
}
const CV={
  eIn :$("sprIn").getContext("2d"),  eOut:$("sprOut").getContext("2d"),
  pIn :$("pRingsIn").getContext("2d"), pOut:$("pRingsOut").getContext("2d")
};
const EW=64, PW=RULES.playerCanvasW, PH=RULES.playerCanvasH;
["sprIn","sprOut"].forEach(id=>{$(id).width=$(id).height=EW;});
["pRingsIn","pRingsOut"].forEach(id=>{$(id).width=PW; $(id).height=PH;});
const E_CFG={baseR:RULES.enemyRingBaseR,  spacing:RULES.enemyRingSpacing,  breathe:RULES.enemyRingBreathe};
const P_CFG={baseR:RULES.playerRingBaseR, spacing:RULES.playerRingSpacing, breathe:RULES.playerRingBreathe};
let t=0, frozen=false, timer=null, glowCache={};
function applyGlow(el,u,px){
  const e=u.layers.length?u.layers[0].e:null;
  const key=el.id+":"+e;
  if(glowCache[el.id]===key) return;
  glowCache[el.id]=key;
  el.style.filter = e
    ? `drop-shadow(0 0 ${px}px ${emoHex(e)}) drop-shadow(0 0 ${px*2.2}px ${emoHex(e)}88)`
    : "none";
}
function tick(){
  if(frozen)return;
  t++; stepLayers(S.enemy); stepLayers(S.player);
  const ec=EW/2, pcx=PW/2, pcy=RULES.playerRingCy;
  paint(CV.eIn ,EW,EW,ec ,ec ,ringsOf(S.enemy ,t,E_CFG,"inner"));
  paint(CV.eOut,EW,EW,ec ,ec ,ringsOf(S.enemy ,t,E_CFG,"outer"));
  paint(CV.pIn ,PW,PH,pcx,pcy,ringsOf(S.player,t,P_CFG,"inner"));
  paint(CV.pOut,PW,PH,pcx,pcy,ringsOf(S.player,t,P_CFG,"outer"));
  applyGlow($("sprOut"),S.enemy,4);
  applyGlow($("pRingsOut"),S.player,4);
}
function setFps(f){ if(timer)clearInterval(timer); timer=setInterval(tick,1000/f); }
tick(); setFps(12);

/* ================= RENDER ================= */
function lineCost(u){return u.line.reduce((s,a)=>s+a.cost,0);}
function renderGauge(el,u,opts){
  const pct=v=>Math.max(0,Math.min(100,v/u.maxMs*100));
  const ecIn=Math.min(u.ec,u.ms), over=Math.max(0,u.ec-u.ms);
  let h="";
  h+=`<div class="seg g-empty" style="width:${pct(u.ms)}%"></div>`;
  h+=`<div class="seg g-dead" style="left:${pct(u.ms)}%;width:${pct(u.maxMs-u.ms)}%"></div>`;
  h+=`<div class="seg g-ec" style="width:${pct(ecIn)}%"></div>`;
  if(over>0) h+=`<div class="seg g-over" style="left:${pct(u.ms)}%;width:${pct(over)}%"></div>`;
  if(opts.spend>0){const f=Math.max(0,u.ec-opts.spend);
    h+=`<div class="seg g-spend" style="left:${pct(f)}%;width:${pct(u.ec-f)}%"></div>`;}
  if(opts.chargeTo>u.ec)
    h+=`<div class="seg g-charge" style="left:${pct(u.ec)}%;width:${pct(opts.chargeTo-u.ec)}%"></div>`;
  if(opts.projMs!=null&&opts.projMs<u.ms)
    h+=`<div class="g-proj" style="left:${pct(opts.projMs)}%"></div>`;
  el.innerHTML=h;
  const anchor=(e,v)=>{
    const x=pct(v); e.style.left=x+"%";
    e.style.transform = x>86 ? "translateX(-100%)" : x<14 ? "translateX(0)" : "translateX(-50%)";
  };
  opts.tagMs.textContent=u.ms; anchor(opts.tagMs,u.ms);
  opts.tagEc.textContent=u.ec; anchor(opts.tagEc,Math.min(u.ec,u.maxMs));
  opts.tagEc.style.background=u.ec>u.ms?"var(--fury)":"var(--euphoria)";
  const near=(u.ms/u.maxMs)<RULES.lowMsWarnPct;
  opts.chevEl.innerHTML=
    `<div class="chev cap" style="left:-14px">${chevronSVG(-1)}</div>`+
    `<div class="chev ceil ${near?"near":""}" style="left:calc(${pct(u.ms)}% - 14px)">${chevronSVG(-1)}</div>`;
  opts.shield.classList.toggle("hide",u.shield<=0);
  opts.shield.innerHTML=u.shield>0
    ? `<svg viewBox="0 0 8 8" shape-rendering="crispEdges">${iconSVG("SHIELD")}</svg>` : "";
}
function renderStats(){
  const p=S.player,e=S.enemy,building=S.phase==="BUILD";
  const pr=building?simulate(p.line,e):{ms:null,ec:e.ec};
  renderGauge($("pGauge"),p,{spend:building?lineCost(p):0,chargeTo:p.ec,projMs:null,
    chevEl:$("pChev"),tagMs:$("pTagMs"),tagEc:$("pTagEc"),shield:$("pShield")});
  renderGauge($("eGauge"),e,{spend:0,chargeTo:pr.ec,projMs:pr.ms,
    chevEl:$("eChev"),tagMs:$("eTagMs"),tagEc:$("eTagEc"),shield:$("eShield")});
}
/* ghosts sit on the LEFT: taps prepend, so that is where the next one lands */
function trackHTML(unit,ghosts){
  let h="";
  if(unit.line.length||ghosts)
    h+=`<div class="term ${ghosts?"dead":""}" style="color:${ghosts?"var(--line)":emoHex(unit.line[0]?.emotion)}"></div>`;
  if(ghosts) for(let i=unit.line.length;i<RULES.lineCap;i++)
    h+=`<div class="link dead"></div><div class="station ghost" style="color:var(--line)">${stationSVG(null)}</div>`;
  unit.line.forEach((a,i)=>{
    h+=`<div class="link" style="color:${emoHex(a.emotion)}"></div>`;
    h+=`<div class="station" data-idx="${i}" style="color:${emoHex(a.emotion)}">${stationSVG(a.icon)}</div>`;
  });
  return h;
}
function renderLines(){
  $("pTrack").innerHTML=trackHTML(S.player,S.phase==="BUILD");
  $("eTrack").innerHTML=S.enemy.line.length?trackHTML(S.enemy,false)
    :`<div class="station ghost" style="color:var(--line)">${stationSVG(null)}</div>`;
}
function buildTray(){
  $("tray").innerHTML=S.player.pool.map(a=>{
    const d=a.kind==="DAMAGE"?`${a.cost} · ${a.power}`:`${a.cost} · ▣${a.power}`;
    return `<div class="abil pxr pxr-sh" data-a="${a.id}" style="color:${emoHex(a.emotion)}">
      <svg viewBox="0 0 8 8" shape-rendering="crispEdges">${iconSVG(a.icon)}</svg>
      <span class="d">${d}</span></div>`;
  }).join("");
  $("tray").querySelectorAll(".abil").forEach(el=>el.addEventListener("click",()=>{
    if(S.phase!=="BUILD")return;
    const a=ABILITIES[el.dataset.a], p=S.player;
    if(p.line.length>=RULES.lineCap||lineCost(p)+a.cost>p.ec)return;
    p.line.unshift(a);            // first tap ends up rightmost = first to fire
    sfx("tap"); render();
  }));
}
function renderTray(){
  const p=S.player,spent=lineCost(p);
  $("tray").querySelectorAll(".abil").forEach(el=>{
    const a=ABILITIES[el.dataset.a];
    el.classList.toggle("dis",!(S.phase==="BUILD"&&p.line.length<RULES.lineCap&&spent+a.cost<=p.ec));
  });
  const btn=$("departBtn"),empty=p.line.length===0;
  btn.classList.toggle("rest",empty);
  btn.textContent=empty?"REST ▶":"DEPART ▶";
}
function render(){renderStats();renderLines();renderTray();}
let tagRow=0;
function bigTag(txt,cls){
  const el=document.createElement("div");
  el.className="bigtag pxr "+(cls||""); el.textContent=txt;
  el.style.top=`calc(40% + ${tagRow*50}px)`;
  tagRow++; setTimeout(()=>{tagRow=Math.max(0,tagRow-1);},760);
  $("screen").appendChild(el); setTimeout(()=>el.remove(),960);
}
async function impact(onEnemy){
  frozen=true; $("flash").classList.add("on"); await sleep(95);
  frozen=false; $("flash").classList.remove("on");
  const el=onEnemy?$("stage"):$("screen");
  el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
  await sleep(270); el.classList.remove("shake");
}
/* Paced layer break: flash → vanish (the rest ease outward) → beat → regrow
   from the centre at the back of the queue.                                */
async function breakLayer(u){
  if(!u.layers.length) return;
  const l=u.layers[0];
  l.flash=Math.ceil(RULES.layerFlashMs/(1000/12))+1;
  sfx("breaklayer");
  await sleep(RULES.layerFlashMs);
  u.layers.shift();
  await sleep(RULES.layerGapMs);
  l.flash=0; l.pos=RULES.maxLayers; u.layers.push(l);
  sfx("regrow");
  await sleep(RULES.layerRegrowMs);
}

/* ================= COMBAT ================= */
async function applyAbility(actor,target,ab,onEnemy){
  if(ab.kind==="SHIELD"){
    actor.shield+=ab.power; bigTag("SHIELD UP","block"); sfx("block");
    renderStats(); await sleep(380); return;
  }
  if(target.shield>0){
    target.shield-=1; bigTag("BLOCKED","block"); sfx("block");
    if(RULES.shieldRotatesLayer&&ab.hits_layer) await breakLayer(target);
    renderStats(); await sleep(380); return;
  }
  const lay=target.layers[0]||null;
  const m=matchup(lay?lay.e:null, ab.emotion);
  const dealt=Math.min(Math.round(ab.power*m.dmg), target.ms);
  const gain=ecFrom(ab,dealt,m);
  target.ms-=dealt; target.ec+=gain;
  bigTag("-"+dealt,"dmg");
  bigTag(gain>0 ? `${m.label} +${gain} EC` : m.label, m.cls);
  sfx(m.sound);
  renderStats();
  await impact(onEnemy);
  if(target.ms<=0){ await clashSequence(target===S.player); return; }
  if(ab.hits_layer) await breakLayer(target);
}
function centerStation(lane,track,st){
  const tx=lane.clientWidth/2-(st.offsetLeft+st.offsetWidth/2);
  track.style.transform=`translateX(${Math.round(tx)}px)`;
}
async function resolveLine(actor,target,laneId,trackId,onEnemy){
  const lane=$(laneId),track=$(trackId);
  if(actor.line.length===0){
    actor.ec+=RULES.restEc; sfx("regrow"); renderStats(); await sleep(800); return;
  }
  actor.ec-=lineCost(actor); renderStats(); sfx("depart"); await sleep(560);
  lane.classList.add("zoom"); await sleep(260);
  const sts=track.querySelectorAll(".station[data-idx]");
  for(let i=actor.line.length-1;i>=0;i--){          // rightmost fires first
    if(S.player.ms<=0||S.enemy.ms<=0)break;
    centerStation(lane,track,sts[i]); sfx("travel"); await sleep(340);
    sts[i].classList.add("active"); sfx("arrive"); await sleep(180);
    await applyAbility(actor,target,actor.line[i],onEnemy);
    await sleep(200);
    sts[i].classList.remove("active"); sts[i].classList.add("spent");
    await sleep(140);
  }
  await sleep(200); lane.classList.remove("zoom");
  track.style.transform="translateX(0)"; await sleep(250);
}
async function clashSequence(playerDied){
  const screen=$("screen"), gauge=playerDied?$("pGauge"):$("eGauge");
  const sr=screen.getBoundingClientRect(), gr=gauge.getBoundingClientRect();
  const cx=gr.left-sr.left+4, cy=gr.top-sr.top+gr.height/2;
  setFps(3); screen.classList.add("slowmo"); gauge.classList.add("clash"); sfx("clash");
  const wv=document.createElement("div"); wv.className="wave";
  wv.style.left=cx+"px"; wv.style.top=cy+"px"; wv.style.transform="translate(-50%,-50%)";
  screen.appendChild(wv);
  wv.animate([{transform:"translate(-50%,-50%) scale(.15)",opacity:1},
              {transform:"translate(-50%,-50%) scale(11)",opacity:0}],
             {duration:2900,easing:"cubic-bezier(.08,.85,.24,1)",fill:"forwards"});
  const cols=Object.values(EMOTIONS).map(e=>e.hex).concat(["#f0ece0"]);
  for(let i=0;i<64;i++){
    const p=document.createElement("div"); p.className="pt";
    const s=4+Math.floor(Math.random()*4)*2;
    p.style.width=p.style.height=s+"px"; p.style.left=cx+"px"; p.style.top=cy+"px";
    p.style.background=cols[i%cols.length]; p.style.transform="translate(-50%,-50%)";
    screen.appendChild(p);
    const ang=Math.random()*Math.PI*2, spd=50+Math.random()*260;
    const bias=(cy<sr.height*0.5)?0.55:-0.55;
    const dx=Math.cos(ang)*spd, dy=Math.sin(ang)*spd*0.75+Math.abs(Math.sin(ang))*spd*bias;
    p.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},
               {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.25)`,opacity:0}],
              {duration:2200+Math.random()*1700,easing:"cubic-bezier(.07,.86,.22,1)",fill:"forwards"});
  }
  $("flash").animate([{opacity:0},{opacity:.9,offset:.10},{opacity:.45,offset:.34},{opacity:0}],
                     {duration:RULES.clashSeconds*1000,fill:"forwards"});
  await sleep(RULES.clashSeconds*1000);
  screen.querySelectorAll(".pt,.wave").forEach(n=>n.remove());
  screen.classList.remove("slowmo"); gauge.classList.remove("clash");
}
function buildEnemyLine(){
  const e=S.enemy, p=S.player; e.line=[]; let ec=e.ec;
  let layers=p.layers.map(l=>l.e), shield=p.shield;
  const shieldAb=e.pool.find(a=>a.kind==="SHIELD");
  if(e.ms<e.maxMs*0.5 && e.shield===0 && shieldAb && ec>=shieldAb.cost){
    e.line.push(shieldAb); ec-=shieldAb.cost;
  }
  while(e.line.length<RULES.lineCap){
    const opts=e.pool.filter(a=>a.kind==="DAMAGE"&&a.cost<=ec);
    if(!opts.length) break;
    let best=opts[0], bestScore=-Infinity;
    for(const a of opts){
      const score=a.power*matchup(layers[0]||null,a.emotion).dmg;
      if(score>bestScore){bestScore=score; best=a;}
    }
    e.line.push(best); ec-=best.cost;
    if(shield>0) shield--;
    else if(best.hits_layer&&layers.length) layers.push(layers.shift());
  }
  e.line.reverse();     // built in execution order, stored left-to-right
}
function endCheck(){
  if(S.enemy.ms<=0){finish("win");return true;}
  if(S.player.ms<=0){finish("lose");return true;}
  return false;
}
function finish(kind){
  S.phase="OVER"; setFps(12); sfx(kind);
  const o=document.createElement("div"); o.className="over "+kind;
  o.innerHTML=`<h1 class="hard">${kind==="win"?"LINE CLEAR":"BREAKDOWN"}</h1>
    <button class="depart pxr pxr-sh" style="width:auto;padding:13px 28px" onclick="location.reload()">RUN AGAIN</button>`;
  $("screen").appendChild(o);
}
async function depart(){
  if(S.phase!=="BUILD"||S.busy)return;
  S.busy=true; S.phase="RESOLVE";
  $("tray").classList.add("hide"); $("departBtn").classList.add("hide");
  renderLines(); renderStats();
  await resolveLine(S.player,S.enemy,"pLane","pTrack",true);
  if(endCheck()){S.busy=false;return;}
  await sleep(300);
  await resolveLine(S.enemy,S.player,"eLane","eTrack",false);
  if(endCheck()){S.busy=false;return;}
  S.round++; S.player.line=[]; buildEnemyLine();
  S.phase="BUILD"; S.busy=false;
  $("tray").classList.remove("hide"); $("departBtn").classList.remove("hide");
  render();
}
$("departBtn").addEventListener("click",depart);
let drag=null;
$("pTrack").addEventListener("pointerdown",e=>{
  if(S.phase!=="BUILD")return;
  const st=e.target.closest(".station"); if(!st||st.classList.contains("ghost"))return;
  drag={idx:+st.dataset.idx,startX:e.clientX,moved:false};
  st.classList.add("dragging"); e.preventDefault();
},{passive:false});
window.addEventListener("pointermove",e=>{
  if(!drag)return;
  const dx=e.clientX-drag.startX; if(Math.abs(dx)>8)drag.moved=true;
  const el=$("pTrack").querySelector(`.station[data-idx="${drag.idx}"]`); if(!el)return;
  el.style.transform=`translateX(${dx}px)`;
  const sts=[...$("pTrack").querySelectorAll(".station[data-idx]")];
  const step=sts.length>1?Math.abs(sts[1].offsetLeft-sts[0].offsetLeft):el.offsetWidth+15;
  const tgt=Math.max(0,Math.min(S.player.line.length-1,drag.idx+Math.round(dx/step)));
  if(tgt!==drag.idx){
    const arr=S.player.line,[m]=arr.splice(drag.idx,1); arr.splice(tgt,0,m);
    drag.idx=tgt; drag.startX=e.clientX; renderLines(); sfx("travel");
    const nu=$("pTrack").querySelector(`.station[data-idx="${tgt}"]`); if(nu)nu.classList.add("dragging");
  }
});
window.addEventListener("pointerup",()=>{
  if(!drag)return;
  if(!drag.moved){ S.player.line.splice(drag.idx,1); sfx("remove"); }
  drag=null; render();
});
buildTray(); buildEnemyLine(); render();
</script>
